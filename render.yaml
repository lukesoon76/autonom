# Render Blueprint for Autonom. Deploy via Render → New → Blueprint (point at this
# repo), or create a Docker Web Service manually and add a disk mounted at /var/data.
services:
  - type: web
    name: autonom
    runtime: docker
    plan: starter
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: AUTONOM_DATA_DIR
        value: /var/data
      - key: HF_HOME
        value: /opt/hf
      - key: ANTHROPIC_API_KEY   # optional — enables Claude answers + EatWhatGPT prose
        sync: false
      # daily in-app Instagram refresh (Render crons can't touch the disk, so the
      # scheduler runs inside the web service). Set the two IG_* secrets to switch on.
      - key: AUTONOM_CLOUD_REFRESH
        value: "1"
      - key: AUTONOM_REFRESH_HOUR_UTC
        value: "22"              # 22:00 UTC ≈ 06:00 MYT
      - key: AUTONOM_REFRESH_ON_BOOT
        value: "1"               # also warm ~90s after each deploy (photos fill fast)
      - key: IG_ACCESS_TOKEN     # long-lived Graph API token (from ig_setup.py)
        sync: false
      - key: IG_USER_ID          # your IG Business account id
        sync: false
      # bulk enrichment throughput for the ~9.6k corpus (photos free; tags on Haiku)
      - key: AUTONOM_WARM_PHOTOS
        value: "1000"            # og:image fetches/day → whole corpus in ~1-2 wks
      - key: AUTONOM_WARM_TAGS
        value: "700"             # Haiku tag fills/day (cheap)
      - key: GOOGLE_MAPS_API_KEY  # optional — broad real photos if you add it
        sync: false
    disk:
      name: autonom-data          # persistent: vector store, accounts, uploads
      mountPath: /var/data
      sizeGB: 1
