# ─────────────────────────────────────────────────────────────────────────────
# FoodRAG source registry — MALAYSIA & SINGAPORE (focused v2)
#
# type:
#   rss     -> machine-readable feed. Cheapest & most reliable. Preferred.
#   sitemap -> no feed; crawl XML sitemap, filter by url_filter substring.
#   manual  -> structured lists (Michelin, 50 Best). Import via curated CSV.
#              Do NOT scrape these; store name/address/stars/cuisine/url only.
#
# priority: 1 = ingest first / weight higher in retrieval. 3 = nice-to-have.
# Feeds marked (verify) use the standard WordPress /feed/ path — run
# `python ingest.py --discover` to confirm or auto-repair before first ingest.
# ─────────────────────────────────────────────────────────────────────────────

sources:
  # ══ MALAYSIA ════════════════════════════════════════════════════════════════
  - name: ChiefEater
    region: MY
    city: Kuala Lumpur
    type: sitemap
    priority: 1
    url: https://chiefeater.com/post-sitemap.xml
    url_filter: ""      # RSS is disabled site-wide; ingest all posts from the sitemap
    note: >
      Community reviews across KL, Penang, Johor, Melaka. RSS feed is disabled
      (all /feed/ paths 301 to the homepage), so we read the Yoast post-sitemap
      instead. Individual place pages carry full addresses — ideal seed for
      geo-enrichment ("nearby"). The at_biz_dir-sitemap*.xml files are a business
      directory if you later want structured address rows.
  - name: ChiefEater Directory
    region: MY
    city: Kuala Lumpur
    type: sitemap
    priority: 3      # ~7,900 static place entries — full scrape only, NOT daily
    url: https://chiefeater.com/sitemap_index.xml
    url_filter: /chiefeaters/
    note: >
      The full ChiefEater community place directory (individual restaurant
      entries with reviewer notes + cuisine tags). Priority 3 so the daily
      --min-priority 2 refresh skips it; ingest with
      `python ingest.py --source ChiefEater --limit 0`. Largely static, so a
      one-off full scrape is enough; re-run occasionally to pick up new places.
  - name: KL Foodie
    region: MY
    city: Kuala Lumpur
    type: rss
    priority: 1
    url: https://klfoodie.com/feed/             # (verify)
  - name: EatDrinkKL
    region: MY
    city: Kuala Lumpur
    type: rss
    priority: 1
    url: http://eatdrinkkl.blogspot.com/feeds/posts/default?alt=rss
  - name: Malaysian Foodie
    region: MY
    city: Kuala Lumpur
    type: rss
    priority: 2
    url: https://www.malaysianfoodie.com/feed/  # (verify)
  - name: KY Speaks
    region: MY
    city: Kuala Lumpur
    type: rss
    priority: 2
    url: https://kyspeaks.com/feed/             # (verify)
  - name: The Yum List
    region: MY
    city: Kuala Lumpur
    type: rss
    priority: 2
    url: https://www.theyumlist.net/feed/       # (verify)
  - name: Bangsar Babe
    region: MY
    city: Kuala Lumpur
    type: rss
    priority: 3
    url: https://www.bangsar-babe.com/feed/     # DEFUNCT: domain no longer resolves (DNS)
    note: Domain does not resolve as of 2026-07; kept for the record, yields nothing.
  - name: Wonderful Malaysia
    region: MY
    city: Kuala Lumpur
    type: rss
    priority: 3
    url: https://www.wonderfulmalaysia.com/feed/ # (verify)
  - name: Time Out KL
    region: MY
    city: Kuala Lumpur
    type: sitemap
    priority: 3
    url: https://www.timeout.com/kuala-lumpur/news_sitemap.xml
    url_filter: /kuala-lumpur/
    note: >
      Time Out exposes a rolling news_sitemap per city (the old
      /<city>/sitemap.xml paths 404). This one is often near-empty; kept for the
      occasional KL food article. Full back-catalogue lives only in the gzipped
      master sitemap.

