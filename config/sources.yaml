# ─────────────────────────────────────────────────────────────────────────────
# FoodRAG source registry — MALAYSIA & SINGAPORE (focused v2)
#
# type:
#   rss     -> machine-readable feed. Cheapest & most reliable. Preferred.
#   sitemap -> no feed; crawl XML sitemap, filter by url_filter substring.
#   manual  -> structured lists (Michelin, 50 Best). Import via curated CSV.
#              Do NOT scrape these; store name/address/stars/cuisine/url only.
#
# priority: 1 = ingest first / weight higher in retrieval. 3 = nice-to-have.
# Feeds marked (verify) use the standard WordPress /feed/ path — run
# `python ingest.py --discover` to confirm or auto-repair before first ingest.
# ─────────────────────────────────────────────────────────────────────────────

sources:
  # ══ MALAYSIA ════════════════════════════════════════════════════════════════
  - name: ChiefEater
    region: MY
    city: Kuala Lumpur
    type: rss
    priority: 1
    url: https://chiefeater.com/feed/          # (verify)
    note: >
      Community reviews across KL, Penang, Johor, Melaka. Individual place pages
      carry full addresses — ideal seed for geo-enrichment ("nearby").
