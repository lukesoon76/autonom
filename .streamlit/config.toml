# Palantir-style monochrome base: black on white, Arial, hairline greys.
# (Dark mode is applied at runtime via the in-app Appearance toggle.)
[theme]
primaryColor = "#111111"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#fafafa"
textColor = "#111111"
font = "sans serif"

[server]
# serve member-uploaded photos (./static/uploads) so they render in cards
enableStaticServing = true
# don't let the source-watcher walk torch/transformers modules (it triggers a
# fatal torchvision import); we don't need hot-reload for a deployed app
fileWatcherType = "none"
