# ChiefEater.com look: warm orange primary, fresh-green accent, near-black
# text on light. (Dark mode applied at runtime via the Appearance toggle.)
[theme]
primaryColor = "#fa8b0c"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#fff7ec"
textColor = "#252525"
font = "sans serif"

[server]
# serve member-uploaded photos (./static/uploads) so they render in cards
enableStaticServing = true
# don't let the source-watcher walk torch/transformers modules (it triggers a
# fatal torchvision import); we don't need hot-reload for a deployed app
fileWatcherType = "none"
